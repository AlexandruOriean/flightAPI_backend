# ---------------------------------------------------------------------------
# Shared configuration. Defaults are production-safe: PostgreSQL, settings from
# environment variables, no H2. Local development uses the `dev` profile
# (application-dev.properties), which the default Maven build activates for
# `./mvnw spring-boot:run`.
# ---------------------------------------------------------------------------

spring.main.banner-mode=off

# --- Reverse proxy ---
# Behind a TLS-terminating proxy or load balancer, take scheme, host and client IP from its
# X-Forwarded-* headers, so Location headers are https://<public host>/..., request.isSecure() is true
# and HSTS is sent. Tomcat only trusts these headers from internal proxy addresses (private ranges and
# loopback); set server.tomcat.remoteip.internal-proxies if the proxy has another address.
server.forward-headers-strategy=native

# --- Database (PostgreSQL) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Fail fast (ms) when the pool is exhausted (default 30s), so requests don't pile up waiting.
spring.datasource.hikari.connection-timeout=5000

# --- Actuator ---
# health: liveness/readiness probes; info: deployed commit and build version (no secrets).
management.endpoints.web.exposure.include=health,info

# --- JPA / Flyway ---
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
# Deadline for every transaction; also applied to each query as its JDBC query timeout, so one slow
# query cannot hold a connection indefinitely. Applies to H2 and PostgreSQL alike.
spring.transaction.default-timeout=10s

# --- Pagination ---
# List endpoints take ?page=0&size=20. A larger requested size is cut down to the maximum.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# --- CORS ---
# Comma-separated browser origins allowed to call the API (e.g. https://flights.example.com).
# Unset: cross-origin requests are rejected.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# --- JWT ---
# Signing key: Base64-encoded, >= 64 bytes (HS512). Generate with: openssl rand -base64 64
app.jwt.secret=${JWT_SECRET}
# Access-token lifetime. Tokens carry the user's roles and cannot be revoked, so a removed role or
# account keeps working until the token expires: keep this short (default 15 minutes). Clients renew
# it with their refresh token, which also picks up role changes.
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# Refresh tokens: single use, rotated on every refresh, revoked by logout. Expired ones are deleted nightly.
app.refresh-token.lifetime=${REFRESH_TOKEN_LIFETIME:7d}
app.refresh-token.reuse-grace=${REFRESH_TOKEN_REUSE_GRACE:10s}

# --- Rate limiting ---
# Attempts per client IP (from X-Forwarded-For when behind a trusted proxy) before 429 Too Many Requests.
# Counted per application instance: with several instances, the effective limit is multiplied.
app.rate-limit.login.requests=10
app.rate-limit.login.period=1m
app.rate-limit.register.requests=10
app.rate-limit.register.period=1h

# --- Admin account ---
# Provisioned at startup; self-registration can never grant ROLE_ADMIN. Skipped when no password is set.
# Set via APP_ADMIN_USERNAME / APP_ADMIN_EMAIL / APP_ADMIN_PASSWORD (password: at least 12 characters).
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}

# Upgrading a database from before V7 only: time zone and currency of airports V7 does not know,
# e.g. LEGACY_AIRPORTS=XYZ:Europe/Berlin:EUR,ABC:America/New_York:USD (see README, "Upgrading an old database")
spring.flyway.placeholders.legacy-airports=${LEGACY_AIRPORTS:}
