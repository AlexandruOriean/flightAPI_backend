name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (prod profile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Only whether the secret exists, never its value: fork PRs (no secrets) and repositories
      # without SONAR_TOKEN skip the analysis instead of failing.
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: SonarQube Cloud uses blame data to tell new code from old
          fetch-depth: 0

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit tests, integration tests (incl. PostgreSQL via Testcontainers; Docker is
      # available on GitHub-hosted runners), coverage gate and -Werror.
      - name: Verify
        run: ./mvnw -B -Pprod verify

      # Analyzer plugins the scanner downloads from SonarQube Cloud, reused between runs
      - name: Cache SonarQube packages
        if: env.HAS_SONAR_TOKEN == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Static analysis and the coverage report from Verify, sent to SonarQube Cloud. Reuses the
      # compiled classes; the token is only exposed to this step.
      - name: SonarQube Cloud analysis
        if: env.HAS_SONAR_TOKEN == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B -Pprod sonar:sonar

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: target/site/jacoco/
          if-no-files-found: ignore
