name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - pom.xml
      - dependency-check-suppressions.xml
      - .github/workflows/security-scan.yml
  schedule:
    # Daily, after nvd-update.yml, so newly published CVEs are caught even without code changes
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-check:
    name: OWASP dependency-check
    # Fork PRs get no code-scanning write access
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Read-only: nvd-update.yml downloads the NVD data daily, so scans never call NVD and an NVD outage
      # cannot fail them. Restores the newest copy (caches from main are visible to pull requests).
      - name: Restore NVD database
        id: nvd
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.dependency-check/data
          key: nvd-${{ runner.os }}-
          restore-keys: nvd-${{ runner.os }}-

      - name: Require an NVD database
        if: steps.nvd.outputs.cache-matched-key == ''
        run: |
          echo "::error::No NVD database in the cache yet. Run the 'NVD database update' workflow on main first."
          exit 1

      # -Pprod scans exactly what ships (no dev-only H2). Fails on CVSS >= 7.
      - name: Scan dependencies
        run: ./mvnw -B -Pprod,security-scan -DskipTests -DautoUpdate=false verify

      - name: Publish results to GitHub code scanning
        if: always() && hashFiles('target/dependency-check-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: target/dependency-check-report.sarif
          category: dependency-check

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: ignore
